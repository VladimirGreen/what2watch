<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>What2Watch</title>
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body class="theme-dark">

  <div id="app">

    <!-- Рандомайзер -->
    <div id="screen-randomizer" class="screen active">
      <div class="card" id="swipe-card">
        <div class="poster-placeholder"></div>
        <div class="card-info">
          <div class="card-chips">
            <button class="chip" id="open-filter-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 4v2h18V4H3zm6 7v2h6v-2H9zm-7 7v2h18v-2H2z"/></svg>
              <span>Настроить</span>
            </button>
            <button class="chip" id="share-movie-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>
              <span>Поделиться</span>
            </button>
          </div>
          <h2>Загрузка...</h2>
          <div class="meta">
            <span class="label">Год:</span> <span class="year"></span>
          </div>
          <div class="meta">
            <span class="label">Рейтинг:</span> <span class="rating"></span>
          </div>
          <div class="meta">
            <span class="label">Жанры:</span> <span class="genres"></span>
          </div>
          <div class="tags"></div>
          <div class="meta">
            <span class="label">В ролях:</span> <span class="actors"></span>
          </div>
          <div class="meta">
            <span class="label">Описание:</span>
            <p class="description"></p>
          </div>
        </div>
      </div>
      <div class="card-actions">
        <button class="btn btn-skip">Не буду</button>
        <button class="btn btn-watched">Смотрел</button>
        <button class="btn btn-watchlist">Буду смотреть</button>
      </div>
    </div>

    <!-- Поиск -->
    <div id="screen-search" class="screen">
      <div class="search-header">
        <input type="text" class="search-input" id="search-input" placeholder="Поиск фильмов...">
        <button class="chip" id="search-filter-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 4v2h18V4H3zm6 7v2h6v-2H9zm-7 7v2h18v-2H2z"/></svg>
          <span>Фильтры</span>
        </button>
      </div>
      <div class="mini-cards" id="search-results"></div>
      <div id="search-collection-select" class="hidden">
        <select id="collection-select"></select>
        <button id="add-to-collection-btn" class="btn btn-primary">Добавить</button>
      </div>
    </div>

    <!-- Подборки -->
    <div id="screen-collections" class="screen">
      <div id="folders-view">
        <h3>Мои подборки</h3>
        <div id="folders-list"></div>
        <button id="create-collection-btn" class="btn btn-secondary">+ Новая подборка</button>
      </div>
      <div id="folder-content" style="display:none;">
        <button class="back-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
          Назад
        </button>
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h3 id="folder-title"></h3>
          <button id="share-collection-btn" class="chip">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>
            <span>Поделиться</span>
          </button>
        </div>
        <div class="mini-cards" id="folder-cards"></div>
        <div id="checklist-toggle" style="margin-top:10px;">
          <label><input type="checkbox" id="show-checked"> Показывать отмеченные</label>
        </div>
      </div>
    </div>

    <!-- Настройки -->
    <div id="screen-settings" class="screen">
      <h3>Тема</h3>
      <div class="theme-selector">
        <button class="theme-btn" data-theme="system">Системная</button>
        <button class="theme-btn" data-theme="light">Светлая</button>
        <button class="theme-btn" data-theme="dark">Тёмная</button>
        <button class="theme-btn" data-theme="retro">Retro</button>
        <button class="theme-btn" data-theme="vhs">VHS</button>
      </div>
      <h3>Поведение</h3>
      <label>
        <input type="checkbox" id="setting-show-watched"> Показывать просмотренные
      </label>
      <h3>Данные</h3>
      <button class="btn btn-secondary" id="clear-cache-btn">🗑 Очистить кэш и перезагрузить</button>
    </div>

    <!-- Шторка деталей (на весь экран) -->
    <div id="movie-sheet" class="sheet-fullscreen" style="display:none;">
      <button class="sheet-close">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
      <div class="sheet-poster" id="sheet-poster"></div>
      <div class="sheet-body">
        <h2 id="sheet-title"></h2>
        <div class="meta"><span class="label">Год:</span> <span id="sheet-year"></span></div>
        <div class="meta"><span class="label">Рейтинг:</span> <span id="sheet-rating"></span></div>
        <div class="meta"><span class="label">Жанры:</span> <span id="sheet-genres"></span></div>
        <div class="meta"><span class="label">В ролях:</span> <span id="sheet-actors"></span></div>
        <div class="meta"><span class="label">Описание:</span> <p id="sheet-description"></p></div>
      </div>
      <div class="sheet-actions">
        <button class="btn btn-watched" id="sheet-mark-watched">Просмотрено</button>
      </div>
    </div>

    <!-- Шторка фильтров (оставляем как было) -->
    <div id="filter-sheet" class="sheet-overlay" style="display:none;">
      <div class="sheet-content">
        <button class="sheet-close" id="filter-close">✕</button>
        <h3>Фильтры подбора</h3>
        <div class="active-filters" id="active-tags"></div>
        <div class="filter-group">
          <label>Жанры:</label>
          <div id="genre-checkboxes"></div>
        </div>
        <div class="filter-group">
          <label><input type="checkbox" id="filter-anime"> Аниме</label>
          <label><input type="checkbox" id="filter-dorama"> Дорамы</label>
        </div>
        <div class="filter-group">
          <label>Год от:</label>
          <input type="number" id="year-from" min="1900" max="2026" value="1900">
          <label>до:</label>
          <input type="number" id="year-to" min="1900" max="2026" value="2026">
        </div>
        <div class="filter-group">
          <label>Минимальный рейтинг:</label>
          <input type="range" id="rating-min" min="0" max="10" step="0.5" value="0">
          <span id="rating-value">0</span>
        </div>
        <div class="filter-group">
          <label><input type="checkbox" id="filter-show-watched"> Показывать просмотренные</label>
        </div>
        <div class="filter-group">
          <label>Атмосферные теги:</label>
          <div id="mood-tags"></div>
        </div>
        <button class="btn btn-primary" id="apply-filters">Применить</button>
        <button class="btn btn-secondary" id="reset-filters">Сбросить все</button>
      </div>
    </div>

    <!-- Навигация -->
    <nav class="bottom-nav">
      <button class="nav-btn active" data-screen="randomizer">🎲</button>
      <button class="nav-btn" data-screen="search">🔍</button>
      <button class="nav-btn" data-screen="collections">📁</button>
      <button class="nav-btn" data-screen="settings">⚙️</button>
    </nav>
  </div>

  <script src="app.js?v=5"></script>
</body>
</html>
